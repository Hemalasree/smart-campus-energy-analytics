<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Campus Energy Analytics</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <!-- Header Logo -->
            <div class="login-header">
                <div class="logo-icon"><i class="fa-solid fa-bolt-lightning"></i></div>
                <h2>Smart Campus ⚡</h2>
                <p>Energy Consumption Analytics System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-id"><i class="fa-solid fa-envelope"></i> Email ID</label>
                    <input type="email" id="login-id" class="form-control full-width-input" placeholder="e.g. admin@campus.edu" required value="admin@campus.edu">
                </div>

                <div class="form-group">
                    <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="login-password" class="form-control full-width-input" placeholder="Enter password" required value="admin">
                    
                    <div class="show-password-row">
                        <label class="checkbox-container">
                            <input type="checkbox" id="show-pass-check" onchange="togglePasswordShow(this)">
                            <span>Show Password</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-login">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
                </button>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" checked>
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="alert('Demo Credentials: admin@campus.edu / admin'); return false;">Forgot Password?</a>
                </div>
            </form>

            <div class="divider">
                <span>OR SIGN IN WITH GOOGLE</span>
            </div>

            <!-- Single Responsive Google Sign-In Button -->
            <div class="google-auth-container">
                <button type="button" class="btn-google" id="btnGoogleSignIn" onclick="handleGoogleSignIn()">
                    <svg viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        <path fill="none" d="M0 0h48v48H0z"/>
                    </svg>
                    <span id="google-btn-text">Sign in with Google</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordShow(checkbox) {
            const passInput = document.getElementById('login-password');
            passInput.type = checkbox.checked ? 'text' : 'password';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const loginId = document.getElementById('login-id').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login_id: loginId, password: password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    alert(data.message || 'Invalid credentials');
                }
            } catch (err) {
                window.location.href = '/';
            }
        }

        async function handleGoogleSignIn() {
            const btn = document.getElementById('btnGoogleSignIn');
            const txt = document.getElementById('google-btn-text');
            btn.style.opacity = '0.85';
            btn.style.pointerEvents = 'none';
            txt.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating with Google...';

            try {
                const res = await fetch('/api/google-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@campus.edu',
                        name: 'Campus Admin (Google Account)'
                    })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    alert('Google Sign-In failed. Please try again.');
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                    txt.innerText = 'Sign in with Google';
                }
            } catch (err) {
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
